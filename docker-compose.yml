services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    env_file:
      - .env.local.backend
    volumes:
      - ./backend:/backend
    ports:
      - "${EXPOSE_BACKEND_PORT}:8080"
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "${EXPOSE_DATABASE_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - python-app-database:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    env_file:
      - .env.local.frontend
    volumes:
      - ./frontend:/app
      - python-app-frontend-node-modules:/app/node_modules
      - python-app-frontend-yarn:/app/.yarn
    ports:
      - "${EXPOSE_FRONTEND_PORT}:3000"

volumes:
  python-app-frontend-node-modules:
  python-app-frontend-yarn:
  python-app-database:
